[project]
site_name = "macOS-setup"
site_url = "https://eshwen.github.io/macOS-setup/"
repo_url = "https://github.com/eshwen/macOS-setup"
repo_name = "eshwen/macOS-setup"
edit_uri = "blob/main/docs/"
watch = ["README.md", "Brewfile"]
extra_css = ["css/extra.css", "css/code_select.css"]

nav = [
  { "Home" = [
    { "Homepage" = "index.md" },
    { "See Also" = "see-also.md" },
  ] },
  { "Getting Started" = [
    "getting_started/getting-started.md",
  ] },
  { "Programs" = [
    "programs/programs.md",
    { "Homebrew" = "programs/homebrew.md" },
    { "CLI" = "programs/cli.md" },
    { "Python" = "programs/python.md" },
    { "LaTeX" = "programs/latex.md" },
  ] },
  { "Mac Utilities" = [
    "mac_utilities/mac-utilities.md",
  ] },
]

[project.extra.version]
provider = "mike"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/eshwen"

[project.plugins.autorefs]

[project.plugins.mike]
alias_type = "symlink"
canonical_version = "latest"

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.tracking",
  "navigation.sections",
  "content.action.edit",
  "content.code.copy",
  "content.code.annotate",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "purple"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
toc.permalink = "⚓︎"
attr_list = {}
md_in_html = {}
tables = {}
admonition = {}
pymdownx.magiclink = {}
pymdownx.snippets.check_paths = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.linenums = true
pymdownx.highlight.linenums_style = "pymdownx-inline"
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.details = {}

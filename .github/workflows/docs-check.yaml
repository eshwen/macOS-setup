name: Check documentation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: docs-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Build docs
        run: uv run zensical build --strict

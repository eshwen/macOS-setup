name: Build project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      actions: 'write'

    steps:
      - uses: actions/checkout@v7
      - uses: eshwen/adrenaline/uv/builder@v0.10.0
        with:
          python-version: '3.14'
          install-dev-deps: true

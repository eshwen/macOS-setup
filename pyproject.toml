[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "macOS-setup"
version = "2.2.0"
description = "Files and scripts useful for macOS. Helps keep synchronisation between my different Mac computers and offers a backup."
authors = [{ name = "Eshwen Bhal, PhD",  email = "milanman.eshb@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.poetry]
requires-poetry = ">=2.0"
package-mode = false

[tool.poetry.group.dev.dependencies]
mkdocs = "^1.5.3"
pymdown-extensions = "~11.0.0"
mkdocs-material = "^9.1.17"
mkdocs-autorefs = "^1.1.0"
mkdocs-section-index = "^0.3.9"
termynal = "~0.14.0"
mike = "^2.1.3"
pre-commit = "^4.0.0"

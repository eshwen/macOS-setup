[project]
name = "macOS-setup"
version = "2.2.0"
description = "Files and scripts useful for macOS. Helps keep synchronisation between my different Mac computers and offers a backup."
authors = [{ name = "Eshwen Bhal, PhD",  email = "milanman.eshb@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = []


[dependency-groups]
dev = [
    "mike>=2.1.3,<3",
    "mkdocs>=1.5.3,<2",
    "mkdocs-autorefs>=1.1.0,<2",
    "mkdocs-material>=9.1.17,<10",
    "mkdocs-section-index>=0.3.9,<0.4",
    "pre-commit>=4.0.0,<5",
    "pymdown-extensions~=11.0.1",
    "termynal~=0.14.0",
]


[tool.uv]
required-version = ">=0.13.0,<0.14"
package = false
